<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedrinho</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #000000; /* Fundo Preto */
            color: #FFFFFF; /* Texto Branco */
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 3rem;
            font-weight: 900;
            text-transform: uppercase;
            line-height: 1.2;
            margin-bottom: 30px;
        }

        /* Estilo da Imagem */
        .foto-grande {
            width: 100%;
            max-width: 900px; /* Limite máximo para telas gigantes */
            height: auto;
            border-radius: 10px; /* Bordas levemente arredondadas */
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2); /* Brilho suave */
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2rem; /* Texto menor no celular */
            }
        }
    </style>
</head>
<body>

    <h1>ESCREVA SUA FRASE AQUI<br>SEGUNDA PARTE DA FRASE</h1>

    <img src="https://i.postimg.cc/4yPGjWpP/pedrinho7.jpg" alt="Foto do Pedrinho" class="foto-grande">

</body>
</html>
